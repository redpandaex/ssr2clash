[package]
name = "ssr2clash"
version = "1.0.0"
description = "A Tauri App"
authors = ["redpandaex"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssr2clash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
anyhow = "1.0.100"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
percent-encoding = "2.3.2"
serde-saphyr = "2.0.0"
fancy-regex = "0.19.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate", "system-proxy", "charset"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
url = "2.5.8"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
uuid = { version = "1.28.0", features = ["v4"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
