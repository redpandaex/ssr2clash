name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 启用 Corepack
        run: corepack enable

      - name: 安装 pnpm（通过 Corepack）
        run: corepack prepare pnpm@latest --activate

      - name: 获取 pnpm store 目录
        shell: pwsh
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $env:GITHUB_ENV

      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建便携版 exe（无安装包）
        run: pnpm tauri build --bundles none

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## 📦 Windows 便携版

            - **文件**：`ssr2clash.exe`
            - **类型**：便携版（无需安装）
            - **系统**：Windows 10 / 11 (64-bit)
            - **说明**：首次运行如无法打开，请确认已安装 WebView2 Runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传便携版 exe 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/ssr2clash.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
