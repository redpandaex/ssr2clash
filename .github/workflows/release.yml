name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and main ancestry
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the application version' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main' }
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Use pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.7 --activate
          corepack pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Verify source
        run: |
          corepack pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Build and verify both Windows packages
        run: ./scripts/package-windows.ps1
      - name: Verify isolated installer hooks
        run: ./scripts/verify-installer-hooks.ps1
      - name: Upload a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            src-tauri/target/distribution/*_portable.zip
            src-tauri/target/distribution/*_setup.exe
            src-tauri/target/distribution/SHA256SUMS.txt
            src-tauri/target/distribution/build-info.json
      - name: Publish only after both uploads succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --repo $env:GITHUB_REPOSITORY
